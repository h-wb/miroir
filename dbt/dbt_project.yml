name: miroir
version: "1.0.0"
profile: miroir

model-paths: ["models"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

models:
  miroir:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    health:
      +schema: health
      +materialized: table
    crossovers:
      +schema: crossovers
      +materialized: table
    # Built only for a Miroir analysis (each model checks miroir_namespace)
    messages:
      +schema: messages
      +materialized: table
    music:
      +schema: music
      +materialized: table
    biking:
      +schema: biking
      +materialized: table
    github:
      +schema: github
      +materialized: table
    browser:
      +schema: browser
      +materialized: table
    # Built only for a Miroir analysis (each model checks miroir_namespace)
    timeline:
      +schema: timeline
      +materialized: table

vars:
  # Local time for the listening and biking data (the health data carries its own offsets)
  timezone: America/Toronto
  # Rows from the authored-search resources carry no author; they are all mine
  github_login: h-wb
