version: 2

# Raw tables loaded by the dlt pipelines
sources:
  - name: apple_health
    schema: "{{ var('miroir_sources', {}).get('apple_health', 'apple_health_data') }}"
    tables:
      - name: metrics
      - name: workouts
  # Apple Messages batches from the Miroir collector (apple_messages connector)
  - name: apple_messages
    schema: "{{ var('miroir_sources', {}).get('apple_messages', 'apple_messages_data') }}"
    tables:
      - name: messages
      - name: chats
      - name: attachments
      - name: chat_messages
      - name: message_attachments
      - name: chat_handles
      - name: contacts
      # Written by the derive worker (decision 040); absent until a kind of this
      # connector is derived. The timeline joins it to attachments.
      - name: media_objects
      - name: _dlt_loads
  - name: listenbrainz
    schema: "{{ var('miroir_sources', {}).get('listenbrainz', 'listenbrainz_data') }}"
    tables:
      - name: listens
  - name: bikeshare
    schema: "{{ var('miroir_sources', {}).get('bikeshare', 'bikeshare_data') }}"
    tables:
      - name: trips
      - name: trips__start_location
      - name: trips__end_location
  # GitHub, raw (load_github). export_* = one-shot seed from the account-data export
  - name: github
    schema: "{{ var('miroir_sources', {}).get('github', 'github_data') }}"
    tables:
      - name: repos
      - name: contributions_daily
      - name: commits
      - name: external_commits
      - name: pull_requests
      - name: issues
      - name: external_issues
      - name: issue_comments
      - name: releases
      - name: export_commits
      - name: export_pull_requests
      - name: export_issues
      - name: export_issue_comments
      - name: export_releases
      - name: export_bots
  # Zen (Firefox) history, raw moz_* tables from the places.sqlite snapshot (load_browser_history)
  - name: browser_history
    schema: "{{ var('miroir_sources', {}).get('browser_history', 'browser_history_data') }}"
    tables:
      - name: zen_places
      - name: zen_historyvisits
      - name: zen_places_metadata
      - name: zen_origins
      - name: _dlt_loads
  # ScreenMemory batches from the Miroir collector (screenmemory connector)
  - name: screenmemory
    schema: "{{ var('miroir_sources', {}).get('screenmemory', 'screenmemory_data') }}"
    tables:
      - name: frames
      - name: app_usage
      # Written by the derive worker (decision 040); absent until its first run.
      - name: media_objects
      - name: _dlt_loads
