# Proton Pass references for Miroir's secrets; no values, safe to commit.
# mise gives a task only the keys in its `secrets = [...]` list; for a one-off
# command use `mise x --secrets KEY -- <command>`. Log in with `mise run pass:login`.

[providers.protonpass]
type = "proton-pass"
vault = "Automation General"
agent_reason = "dlt fnox"

[secrets]
# Source credentials.
LISTENBRAINZ__ACCESS_TOKEN     = { provider = "protonpass", value = "pass://Automation General/listenbrainz/access-token" }
BIKESHARE__MEMBER_ID           = { provider = "protonpass", value = "pass://Automation General/bikeshare/member-id" }
BIKESHARE__AUTHORIZATION_TOKEN = { provider = "protonpass", value = "pass://Automation General/bikeshare/authorization-token" }
GITHUB__ACCESS_TOKEN           = { provider = "protonpass", value = "pass://Automation General/github-pipelines/access-token" }

# Operator copies of cluster credentials (BWS items `prefect` and `miroir`, CNPG
# secrets `postgres-metabase-app` and `postgres-miroir-app`).
DESTINATION__POSTGRES__CREDENTIALS__PASSWORD = { provider = "protonpass", value = "pass://Automation General/postgres-metabase/password" }
PREFECT_API_URL                              = { provider = "protonpass", value = "pass://Automation General/prefect/api-url" }
PREFECT_API_AUTH_STRING                      = { provider = "protonpass", value = "pass://Automation General/prefect/api-auth-string" }
# The only API token, so full admin.
MIROIR_API_TOKEN                             = { provider = "protonpass", value = "pass://Automation General/miroir/api-token" }
MIROIR_METADATA__PASSWORD                    = { provider = "protonpass", value = "pass://Automation General/miroir/metadata-password" }
# Decrypts stored connection credentials. Copy the existing key; never generate a new one.
MIROIR_SECRET_KEY                            = { provider = "protonpass", value = "pass://Automation General/miroir/secret-key" }
